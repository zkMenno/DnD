# From AppInfra's templates/app-deploy.yml, set up for the D&D app (service dnd, image dnd-tracker).
# On every push to main (live) or staging (staging copy), or when run by hand: test natively on GitHub's Arm runner
# (dnd: build + lint, then the server rules and web browser tests against a fresh PocketBase built from server/),
# build an Arm image there too, push it to GHCR, then tell the server to pull and restart just this app, and wait
# for its /health to answer. Jobs run in order: test → build → deploy; one deploy at a time (concurrency group).
# The garden/PostGIS/worker parts come from the shared template and are switched off for dnd (see env).
# Repository secrets needed: SSH_HOST, SSH_USER, SSH_KEY, SSH_KNOWN_HOSTS (same values as the infra repo).
#
# Images are tagged with the commit sha only (no `latest`): the server's .env names the exact build it runs.
# Token scope: the workflow's GITHUB_TOKEN gets nothing by default; each job asks for what it needs, and only
# `build` may push packages. Actions are pinned to commit shas (the comment says which release); to update,
# take the sha a release tag points at from the action's GitHub releases page, never just the tag.
name: Deploy
on:
  push:
    branches: [main, staging]               # main → live (dnd), staging → staging.dungeontracker.com (dnd-staging)
  workflow_dispatch:
env:
  APP: dnd                                 # service name in infra/compose.yml
  # Where this push goes: `main` deploys the live service, the `staging` branch its staging copy (AppInfra PR #11).
  # Same image either way; APP stays `dnd` so both share one build cache.
  SERVICE: ${{ github.ref_name == 'staging' && 'dnd-staging' || 'dnd' }}
  IMAGE_NAME: dnd-tracker                   # image name compose.yml expects (garden-app / dnd-tracker / french-app); independent of the repo's name
  # Optional second image: the folder with the app's worker Dockerfile (garden: worker → image
  # <app>-worker, service <app>-worker in compose.yml). Leave empty for apps without one.
  WORKER_CONTEXT: ""
  # Tests. Empty TEST_CMD runs `npm run check` and `npm test` if the package has them (garden).
  # dnd: TEST_CMD "npm run check" (build + lint) and TEST_POSTGIS "false" (it's PocketBase, no Postgres). WEB_TESTS
  # "true" then runs `bash tools/test.sh web` (server rules, web e2e, headers + limits) on a PocketBase built from
  # server/ and Playwright's Chromium, with saved D&D Beyond answers (tools/test/fixtures/ddb): never dndbeyond.com.
  # The claude.ai sheet tests (tools/test.sh sheets) still run before each push, not here.
  TEST_CMD: "npm run check"
  WEB_TESTS: "true"
  # The app's public address for the health check after deploying. Empty: https://<APP>.<DOMAIN variable>.
  # dnd: "https://dungeontracker.com".
  PUBLIC_URL: ${{ github.ref_name == 'staging' && 'https://staging.dungeontracker.com' || 'https://dungeontracker.com' }}
  TEST_POSTGIS: "false"                    # start a throwaway PostGIS for the tests
concurrency: { group: deploy, cancel-in-progress: false }
permissions: {}                            # per job below
jobs:
  test:
    # Natively on Arm, like the server: the tests exercise the same arm64 builds of Node, esbuild/rolldown,
    # numpy/scipy/rasterio/GDAL and PostGIS that production runs, not their x86 twins. For dnd: `npm run check`
    # (build + lint), then the web tests (WEB_TESTS); the DATABASE_URL values below are the template's and unused here.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/garden_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Throwaway PostGIS for the test suite. The postgis/postgis image is amd64-only, so (like the
      # server, infra/postgres/Dockerfile) add PostGIS from the PGDG apt repo to the multi-arch postgres
      # image. A step rather than a `services:` container, because services can't be built first.
      - name: PostGIS (arm64)
        if: env.TEST_POSTGIS == 'true'
        run: |
          docker build -t test-postgis - <<'EOF'
          FROM postgres:17-bookworm
          RUN apt-get update \
           && apt-get install -y --no-install-recommends postgresql-17-postgis-3 postgresql-17-postgis-3-scripts \
           && rm -rf /var/lib/apt/lists/*
          EOF
          # health over TCP: during first-boot init only the Unix socket answers
          docker run -d --name db -e POSTGRES_PASSWORD=test -p 5432:5432 \
            --health-cmd "pg_isready -U postgres -h 127.0.0.1" --health-interval 2s test-postgis
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' db)" = healthy ] && exit 0; sleep 2
          done
          docker logs db; exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - name: Architecture
        run: uname -m && node -p 'process.version + " " + process.arch'
      - run: npm ci
      - name: Tests
        run: |
          if [ -n "$TEST_CMD" ]; then
            bash -euo pipefail -c "$TEST_CMD"
          else
            npm run check --if-present
            npm test --if-present
          fi
      # ── dnd web tests (WEB_TESTS): PocketBase from source, Chromium, the fake mail server, then tools/test.sh web ──
      # Go version from server/go.mod (as the Dockerfile's golang image); module + build cache keyed on go.sum.
      - name: PocketBase (from server/, like the Dockerfile)
        if: env.WEB_TESTS == 'true'
        working-directory: server
        # the runner's own Go (only actions from the AppInfra template are allowed); GOTOOLCHAIN=auto fetches the
        # version server/go.mod asks for if the runner's is older
        run: GOTOOLCHAIN=auto CGO_ENABLED=0 GOFLAGS=-mod=mod go build -trimpath -o "$RUNNER_TEMP/pocketbase" . && "$RUNNER_TEMP/pocketbase" --version
      # Playwright's Chromium; --with-deps adds its system libraries.
      - name: Chromium for Playwright
        if: env.WEB_TESTS == 'true'
        run: |
          npx playwright install --with-deps chromium
          echo "CHROMIUM=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_ENV"
      # the fake mail server (tools/mailsink.py) for the sign-in code tests needs aiosmtpd
      - if: env.WEB_TESTS == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - if: env.WEB_TESTS == 'true'
        run: pip install aiosmtpd
      # HTTPS_PROXY points nowhere, so a fetch from the server that skipped the fixtures fails the tests instead of
      # calling dndbeyond.com (the tests themselves only talk plain http to 127.0.0.1).
      - name: Web tests (server rules, web e2e, headers + limits)
        if: env.WEB_TESTS == 'true'
        env:
          PB_BIN: ${{ runner.temp }}/pocketbase
          PB_WORK: ${{ runner.temp }}/pb
          PB_PID: ${{ runner.temp }}/pb.pid
          PB_LOG: ${{ runner.temp }}/pb.log
          DDB_FIXTURES: ${{ github.workspace }}/tools/test/fixtures/ddb
          OUT: ${{ runner.temp }}/sheet-tests
          MAILSINK: ${{ runner.temp }}/mailsink.txt
          HTTPS_PROXY: http://127.0.0.1:9
        # the lower-case twin is set in the command: Actions treats env names case-insensitively (duplicate key)
        run: https_proxy=http://127.0.0.1:9 bash tools/test.sh web
      - name: Server log (on failure)
        if: failure() && env.WEB_TESTS == 'true'
        run: tail -n 200 "$RUNNER_TEMP/pb.log" || true
      # the worker's queue and job tests against the same PostGIS (WhiteboxTools tests run in the image's test stage)
      - if: env.WORKER_CONTEXT != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.WORKER_CONTEXT }}/requirements*.txt
      - if: env.WORKER_CONTEXT != ''
        working-directory: ${{ env.WORKER_CONTEXT }}
        env:
          WORKER_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/garden_worker_test
        # --only-binary: a dependency without an aarch64 wheel fails here instead of compiling for minutes
        run: |
          pip install --only-binary=:all: -r requirements-dev.txt
          python -c 'import platform, numpy, rasterio; print(platform.machine(), "numpy", numpy.__version__, "GDAL", rasterio.__gdal_version__)'
          python -m pytest -q
  build:
    needs: test
    runs-on: ubuntu-24.04-arm             # native Arm build: matches the CAX31 server, no emulation
    # A cold garden worker build compiles WhiteboxTools with LTO and one codegen unit (~15 min on the
    # runner); the GHA layer cache skips it while its build script is unchanged.
    timeout-minutes: 60
    permissions: { contents: read, packages: write }   # the only job that can push to GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Image names (GHCR needs lower case)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${APP}-worker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # one cache scope per image, so the app's and the worker's layers never evict each other
          cache-from: type=gha,scope=${{ env.APP }}
          cache-to: type=gha,mode=max,scope=${{ env.APP }}
      - name: Worker tests (the image's test stage, with WhiteboxTools)
        if: env.WORKER_CONTEXT != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ env.WORKER_CONTEXT }}
          target: test
          platforms: linux/arm64
          push: false
          # mode=max also stores the builder stages (the garden worker's WhiteboxTools compile)
          cache-from: type=gha,scope=${{ env.APP }}-worker
          cache-to: type=gha,mode=max,scope=${{ env.APP }}-worker
      - name: Worker image
        if: env.WORKER_CONTEXT != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ env.WORKER_CONTEXT }}
          target: runtime
          platforms: linux/arm64
          push: true
          tags: ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.APP }}-worker
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions: {}                        # only talks to the server over SSH
    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy on the server
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "deploy ${{ env.SERVICE }} ${{ github.sha }}"   # forced command: scripts/ci-entry.sh
      - name: Check it's up
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          url="${PUBLIC_URL:-https://$APP.$DOMAIN}"
          for _ in $(seq 1 20); do
            curl -fsS "$url/health" && exit 0; sleep 6
          done; echo "health check failed: $url/health"; exit 1
